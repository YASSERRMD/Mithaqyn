version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mithaqyn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mithaqyn_db
      POSTGRES_USER: mithaqyn
      POSTGRES_PASSWORD: mithaqyn_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mithaqyn -d mithaqyn_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mithaqyn_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
